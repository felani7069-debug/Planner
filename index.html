<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="برنامه‌ریز"><meta name="theme-color" content="#2f7d6d"><title>برنامه‌ریز روزانه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1e1d1a;--mut:#807b70;--ac:#2f7d6d;--acs:#dff0ec;--bd:#e7e3d9;--hi:#d9534f;--mid:#e0a030;--lo:#4a90c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171815;--card:#222320;--tx:#efece4;--mut:#9a958a;--ac:#5fc0ac;--acs:#243732;--bd:#33342f}}
:root[data-theme="dark"]{--bg:#171815;--card:#222320;--tx:#efece4;--mut:#9a958a;--ac:#5fc0ac;--acs:#243732;--bd:#33342f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px}
.w{max-width:560px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:13px;font-weight:600;color:var(--mut);margin:4px 0 0}
.date{font-size:24px;font-weight:800;margin:2px 0 2px}
.sub{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;margin:12px 0;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--bd)}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font:inherit;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--acs);color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
textarea,input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;width:100%}
textarea{resize:none;height:64px}
.row{display:flex;gap:6px;margin-top:8px;align-items:center}
.row>*{flex:1;min-width:0}
.row .ic{flex:0 0 42px}
button.b{border:0;border-radius:10px;padding:9px;font:inherit;cursor:pointer;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--acs);color:var(--ac)}
button.ic{font-size:18px;padding:7px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.sec{font-weight:600;font-size:13px;color:var(--mut);margin:14px 4px 6px}
.t{display:flex;gap:10px;align-items:flex-start;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:6px}
.t input[type=checkbox]{width:22px;height:22px;flex:0 0 22px;accent-color:var(--ac);margin-top:1px;padding:0}
.t .m{flex:1;min-width:0}
.t.d .tt{text-decoration:line-through;color:var(--mut)}
.meta{font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-top:7px;flex:0 0 9px}
.x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer}
.warn{background:#fdf0e0;color:#8a5a10;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3b3220;color:#e8c27a}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--mut)}
.cal button{border:1px solid transparent;background:none;border-radius:10px;padding:6px 0;font:inherit;color:var(--tx);cursor:pointer;min-height:42px}
.cal button.td{border-color:var(--ac)}
.cal button.sl{background:var(--ac);color:#fff}
.cal small{display:block;font-size:10px;color:var(--ac)}
.cal button.sl small{color:#fff}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;max-width:536px;margin:auto;background:var(--ac);color:#fff;padding:12px;border-radius:12px;z-index:9;font-weight:600;display:none}
.empty{text-align:center;color:var(--mut);padding:22px 0}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="w">
  <h1 id="wd"></h1>
  <div class="date" id="dt"></div>
  <div class="sub" id="gr"></div>
  <div class="tabs"><button id="t1" class="on">📋 کارها</button><button id="t2">📅 تقویم</button></div>
  <div id="cal" style="display:none"></div>
  <div class="card">
    <textarea id="txt" placeholder="کارهای امروزت رو بنویس یا بگو… مثلا: فردا ساعت ۱۰ جلسه دارم، بعدش خرید نون و زنگ به مامان"></textarea>
    <div class="row">
      <input id="tm" type="time" title="ساعت یادآور">
      <select id="pr"><option value="mid">اولویت متوسط</option><option value="high">اولویت بالا</option><option value="low">اولویت کم</option></select>
      <select id="ct"><option>شخصی</option><option>کار</option><option>خرید</option><option>سلامت</option><option>درس</option></select>
    </div>
    <div class="row">
      <button class="b ic g" id="mic" title="صحبت کن">🎤</button>
      <button class="b ic g" id="cam" title="عکس">🖼️</button>
      <button class="b" id="add" style="flex:2">افزودن</button>
      <button class="b g" id="ai" style="flex:2">✨ هوشمند</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="sub" id="msg" style="margin-top:6px"></div>
  </div>
  <div id="list"></div>
</div>
<script>
(function(){
var DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
var MON=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var PC={high:'var(--hi)',mid:'var(--mid)',low:'var(--lo)'};
function g2j(gy,gm,gd){var a=[0,31,59,90,120,151,181,212,243,273,304,334],g2=gm>2?gy+1:gy,d=355666+365*gy+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)+gd+a[gm-1],jy=-1595+33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365}return[jy,d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),1+(d<186?d%31:(d-186)%30)]}
function j2g(jy,jm,jd){jy+=1595;var d=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:((jm-7)*30)+186),gy=400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}var gd=d+1,s=[0,31,((gy%4==0&&gy%100!=0)||gy%400==0)?29:28,31,30,31,30,31,31,30,31,30,31],gm;for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]}
function p2(n){return(n<10?'0':'')+n}
function key(y,m,d){return y+'-'+p2(m)+'-'+p2(d)}
function dkey(dt){return key(dt.getFullYear(),dt.getMonth()+1,dt.getDate())}
function pk(k){var a=k.split('-');return[+a[0],+a[1],+a[2]]}
function fa(n){return String(n).replace(/\d/g,function(c){return'۰۱۲۳۴۵۶۷۸۹'[c]})}
function wdOf(k){var a=pk(k);return DAYS[(new Date(a[0],a[1]-1,a[2],12).getDay()+1)%7]}
function jt(k){var a=pk(k),j=g2j(a[0],a[1],a[2]);return fa(j[2])+' '+MON[j[1]-1]}
function jlen(y,m){if(m<7)return 31;if(m<12)return 30;var g=j2g(y,12,30),b=g2j(g[0],g[1],g[2]);return b[1]==12?30:29}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var today=dkey(new Date()),S={tasks:[],sel:today,tab:1,jm:null};
try{S.tasks=JSON.parse(localStorage.getItem('tasks_v1')||'[]')}catch(e){}
function save(){try{localStorage.setItem('tasks_v1',JSON.stringify(S.tasks))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function addTask(t){S.tasks.push({id:uid(),title:t.title,date:t.date||S.sel,time:t.time||'',pr:t.pr||'mid',ct:t.ct||'شخصی',done:false,notified:false});save()}
function msg(t){$('msg').textContent=t||''}
function toast(t){var e=$('toast');e.textContent='⏰ '+t;e.style.display='block';setTimeout(function(){e.style.display='none'},9000)}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop()},500)}catch(e){}}

function tItem(t,carried){
  return '<div class="t'+(t.done?' d':'')+'"><input type="checkbox" data-c="'+t.id+'"'+(t.done?' checked':'')+'><span class="dot" style="background:'+PC[t.pr]+'"></span><div class="m"><div class="tt">'+esc(t.title)+'</div><div class="meta">'+(t.time?'<span>⏰ '+fa(t.time)+'</span>':'')+'<span>'+esc(t.ct)+'</span>'+(carried?'<span>↩️ مانده از '+jt(t.date)+'</span>':'')+'</div></div><button class="x" data-x="'+t.id+'">×</button></div>'
}
var RK={high:0,mid:1,low:2};
function sorter(a,b){return (a.done-b.done)||(RK[a.pr]-RK[b.pr])||((a.time||'99')<(b.time||'99')?-1:1)}
function render(){
  var a=pk(S.sel),j=g2j(a[0],a[1],a[2]);
  $('wd').textContent=wdOf(S.sel)+(S.sel==today?' · امروز':'');
  $('dt').textContent=fa(j[2])+' '+MON[j[1]-1]+' '+fa(j[0]);
  $('gr').textContent=S.sel;
  $('t1').className=S.tab==1?'on':'';$('t2').className=S.tab==2?'on':'';
  $('cal').style.display=S.tab==2?'block':'none';
  if(S.tab==2)renderCal();
  var own=S.tasks.filter(function(t){return t.date==S.sel}).sort(sorter),car=[];
  if(S.sel==today)car=S.tasks.filter(function(t){return t.date<today&&!t.done}).sort(sorter);
  var all=own.concat(car),dn=all.filter(function(t){return t.done}).length,h='';
  h+='<div class="card"><b>'+fa(dn)+' از '+fa(all.length)+' کار انجام شد</b><div class="bar"><i style="width:'+(all.length?dn/all.length*100:0)+'%"></i></div></div>';
  if(car.length)h+='<div class="warn">'+fa(car.length)+' کار از روزهای قبل انجام نشده و به امروز منتقل شد.</div>';
  if(car.length)h+='<div class="sec">انجام‌نشده از قبل</div>'+car.map(function(t){return tItem(t,1)}).join('');
  h+='<div class="sec">'+(S.sel==today?'کارهای امروز':'کارهای این روز')+'</div>'+(own.length?own.map(function(t){return tItem(t,0)}).join(''):'<div class="empty">هنوز کاری ننوشتی ✍️</div>');
  if(S.sel<today){var nd=own.filter(function(t){return!t.done});h+='<div class="sec">'+(nd.length?'❌ '+fa(nd.length)+' کار انجام نشد':'✅ همه کارها انجام شد')+'</div>'}
  $('list').innerHTML=h;
}
function renderCal(){
  if(!S.jm){var a=pk(S.sel),j=g2j(a[0],a[1],a[2]);S.jm=[j[0],j[1]]}
  var y=S.jm[0],m=S.jm[1],g=j2g(y,m,1),off=(new Date(g[0],g[1]-1,g[2],12).getDay()+1)%7,n=jlen(y,m),h='<div class="card"><div class="nav"><button class="x" data-m="1">›</button><span>'+MON[m-1]+' '+fa(y)+'</span><button class="x" data-m="-1">‹</button></div><div class="cal">';
  DAYS.forEach(function(d){h+='<div class="h">'+d[0]+'</div>'});
  for(var i=0;i<off;i++)h+='<div></div>';
  for(var d=1;d<=n;d++){var gg=j2g(y,m,d),k=key(gg[0],gg[1],gg[2]),c=S.tasks.filter(function(t){return t.date==k}).length;h+='<button data-d="'+k+'" class="'+(k==today?'td ':'')+(k==S.sel?'sl':'')+'">'+fa(d)+'<small>'+(c?'● '+fa(c):'&nbsp;')+'</small></button>'}
  $('cal').innerHTML=h+'</div></div>';
}
document.addEventListener('click',function(e){
  var t=e.target,c;
  if(c=t.getAttribute('data-x')){S.tasks=S.tasks.filter(function(x){return x.id!=c});save();render()}
  else if(c=t.getAttribute('data-d')){S.sel=c;render()}
  else if(c=t.getAttribute('data-m')){S.jm[1]+=+c;if(S.jm[1]>12){S.jm[1]=1;S.jm[0]++}if(S.jm[1]<1){S.jm[1]=12;S.jm[0]--}renderCal()}
});
document.addEventListener('change',function(e){var c=e.target.getAttribute('data-c');if(c){S.tasks.forEach(function(t){if(t.id==c)t.done=e.target.checked});save();render()}});
$('t1').onclick=function(){S.tab=1;render()};
$('t2').onclick=function(){S.tab=2;render()};
$('add').onclick=function(){
  var v=$('txt').value.trim();if(!v)return;
  addTask({title:v,time:$('tm').value,pr:$('pr').value,ct:$('ct').value});
  $('txt').value='';$('tm').value='';askNotif();render();
};
var smp=null;
if(window.claude&&claude.use)claude.use('sample').then(function(s){smp=s}).catch(function(){});
function nowCtx(){return 'امروز: '+today+' ('+wdOf(today)+'، '+jt(today)+'). روز انتخاب‌شده: '+S.sel+'.'}
function en(s){return s.replace(/[۰-۹]/g,function(c){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(c)})}
function localParse(v){var n=0;en(v).split(/[\n،,؛;]+|\sو\s|\sبعدش\s/).forEach(function(s){s=s.trim();if(!s)return;var a=pk(S.sel),off=0,tm='';
 if(/پس‌?فردا/.test(s))off=2;else if(/فردا/.test(s))off=1;
 var m=s.match(/(\d{1,2}):(\d\d)/),h,mi=0;if(m){h=+m[1];mi=+m[2]}else if(m=s.match(/ساعت\s*(\d{1,2})/)){h=+m[1]}
 if(h!==undefined){if(h<12&&/عصر|بعد ?از ?ظهر|شب/.test(s))h+=12;tm=p2(h)+':'+p2(mi)}
 var t=s.replace(/ساعت\s*\d{1,2}(:\d\d)?/,'').replace(/\d{1,2}:\d\d/,'').replace(/پس‌?فردا|فردا|امروز|صبح|عصر|شب|ظهر/g,'').replace(/\s+/g,' ').trim();
 if(!t)return;var d=new Date(a[0],a[1]-1,a[2]+off,12);addTask({title:t,date:dkey(d),time:tm});n++});
 msg(n?fa(n)+' کار اضافه شد ✅':'کاری پیدا نشد.');askNotif();render();return n>0}
function parseAI(text,imgs){
  if(!smp){return Promise.resolve(localParse(text))}
  msg('در حال فهمیدن… ⏳');
  var p=nowCtx()+'\nمتن/تصویر کاربر را به فهرست کار تبدیل کن. فقط JSON خالص برگردان: آرایه‌ای از {"title":"عنوان کوتاه فارسی","date":"YYYY-MM-DD میلادی (اگر نگفته، روز انتخاب‌شده؛ فردا/پس‌فردا/نام روز هفته/تاریخ شمسی را به میلادی تبدیل کن)","time":"HH:MM یا خالی","pr":"high|mid|low","ct":"شخصی|کار|خرید|سلامت|درس"}.\nمتن کاربر: '+(text||'(از تصویر کارها را استخراج کن)');
  var o=imgs?{images:imgs}:{};
  return smp.json(p,o).then(function(r){
    var a=Array.isArray(r)?r:(r&&r.tasks)||[];
    a.forEach(function(t){if(t&&t.title)addTask({title:t.title,date:/^\d{4}-\d\d-\d\d$/.test(t.date)?t.date:S.sel,time:/^\d\d:\d\d$/.test(t.time)?t.time:'',pr:PC[t.pr]?t.pr:'mid',ct:t.ct||'شخصی'})});
    msg(a.length?fa(a.length)+' کار اضافه شد ✅':'کاری پیدا نشد.');askNotif();render();return true
  }).catch(function(e){msg('نشد: '+((e&&e.message)||'خطا')+' — با «افزودن» دستی بنویس.');return false})
}
$('ai').onclick=function(){var v=$('txt').value.trim();if(!v)return;parseAI(v).then(function(ok){if(ok)$('txt').value=''})};
$('cam').onclick=function(){$('file').click()};
$('file').onchange=function(){var f=this.files[0];this.value='';if(!f)return;
  if(!smp){msg('خواندن عکس در این نمایش در دسترس نیست.');return}
  Promise.resolve(smp.limits?smp.limits():{images:true}).then(function(l){if(l&&l.images===false){msg('این حالت عکس را پشتیبانی نمی‌کند.');return}parseAI($('txt').value.trim(),[f])})};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,on=false;
$('mic').onclick=function(){
  if(!SR){msg('مرورگرت گفتار به نوشتار را پشتیبانی نمی‌کند. از میکروفون کیبوردت استفاده کن.');return}
  if(on){rec.stop();return}
  rec=new SR();rec.lang='fa-IR';rec.interimResults=false;rec.continuous=true;
  rec.onresult=function(e){var s='';for(var i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';$('txt').value=($('txt').value+' '+s).trim()};
  rec.onend=function(){on=false;$('mic').textContent='🎤';msg('بعد از گفتن، «✨ هوشمند» را بزن.')};
  rec.onerror=function(){msg('اجازهٔ میکروفون داده نشد.')};
  try{rec.start();on=true;$('mic').textContent='⏹️';msg('گوش می‌دم… 🎙️')}catch(e){msg('میکروفون شروع نشد.')}
};
function askNotif(){try{if(window.Notification&&Notification.permission=='default')Notification.requestPermission()}catch(e){}}
function tick(){
  var nd=dkey(new Date());if(nd!=today){if(S.sel==today)S.sel=nd;today=nd;render()}
  var d=new Date(),hm=p2(d.getHours())+':'+p2(d.getMinutes()),ch=false;
  S.tasks.forEach(function(t){if(!t.done&&!t.notified&&t.time&&t.date==today&&t.time<=hm){t.notified=true;ch=true;toast(t.title);beep();
    try{if(window.Notification&&Notification.permission=='granted')new Notification('یادآور',{body:t.title})}catch(e){}}});
  if(ch)save();
}
setInterval(tick,15000);document.addEventListener('visibilitychange',tick);
render();tick();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
